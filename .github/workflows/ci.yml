name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit -p programs/trustlayer_escrow/tsconfig.json
      - name: Browser regression checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record dependency advisories (tracked release risks)
        if: always()
        run: npm audit --omit=dev --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-verification
          path: |
            test-results/
            dependency-audit.json
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SQL encoding before container startup
        run: npm run test:sql:encoding
      - uses: supabase/setup-cli@v1
        with:
          version: 2.65.5
      - name: Start disposable local Supabase
        shell: bash
        run: |
          set -o pipefail
          supabase start 2>&1 | tee /tmp/trustlayer-supabase-start.log
      - name: Diagnose local Supabase startup failure
        if: failure()
        run: |
          df -h
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          tail -n 200 /tmp/trustlayer-supabase-start.log
      - name: Preserve failed startup output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-startup-failure
          path: /tmp/trustlayer-supabase-start.log
          retention-days: 7
      - run: supabase db reset
      - run: supabase test db
      - name: Workspace authorization regressions (local database only)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/verification/workspace.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/verification/challenges.sql
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The application's lockfile includes Edition 2024 manifests. Do not use
      # Anchor CLI's legacy installation toolchain as the project build toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Solana and Anchor tooling
        run: |
          curl -fsSL https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar -xj -C "$HOME"
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
          # Anchor CLI's own lockfile contains time 0.3.29; isolate its installer.
          rustup toolchain install 1.79.0 --profile minimal
          cargo +1.79.0 install anchor-cli --version 0.30.1 --locked
      - name: Record host and Solana toolchains
        run: |
          rustc --version
          cargo --version
          solana --version
          cargo-build-sbf --version
          anchor --version
      - name: Validate committed Cargo dependency metadata
        run: cargo metadata --locked --format-version 1 > /tmp/trustlayer-cargo-metadata.json
      - name: Create disposable local test wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/trustlayer-localnet.json"
      - name: Configure disposable Localnet program identity before compilation
        run: |
          node --test scripts/ci-localnet-identity.test.mjs
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --outfile target/deploy/trustlayer_escrow-keypair.json
          node scripts/ci-localnet-identity.mjs --configure
      - name: Build isolated SBF test program
        run: anchor build
      - name: Verify compiled IDL and Localnet identity alignment
        run: node scripts/ci-localnet-identity.mjs --verify
      - name: Run fresh local-validator security and lifecycle tests
        run: anchor test --skip-build
      - name: Run host Rust tests
        run: cargo test --locked -p trustlayer_escrow --lib
      - name: Check build did not rewrite the dependency lockfile
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-build-evidence
          path: |
            Cargo.lock
            target/idl/
