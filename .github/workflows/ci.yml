name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit -p programs/trustlayer_escrow/tsconfig.json
      - name: Browser regression checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record dependency advisories (tracked release risks)
        if: always()
        run: npm audit --omit=dev --json > dependency-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-verification
          path: |
            test-results/
            dependency-audit.json
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.65.5
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Workspace authorization regressions (local database only)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/verification/workspace.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/verification/challenges.sql
  contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Anchor 0.30.1 locks time 0.3.29, which fails to compile on Rust >=1.80.
      - uses: dtolnay/rust-toolchain@1.79.0
      - name: Install pinned Solana and Anchor tooling
        run: |
          curl -fsSL https://github.com/solana-labs/solana/releases/download/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar -xj -C "$HOME"
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
          cargo install anchor-cli --version 0.30.1 --locked
      - name: Build and test fresh upgradeable deployment
        run: |
          solana-keygen new --no-bip39-passphrase --silent
          anchor build
          anchor keys sync
          anchor build
          anchor test --skip-build
          cargo test -p trustlayer_escrow --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-build-evidence
          path: |
            Cargo.lock
            target/idl/
